driver.browser=chrome
driver.headless=false
driver.baseUrl=http://localhost:8080
driver.remoteUrl=
driver.startMaximized=true
driver.browserSize=1366x768
driver.pageLoadTimeout=30000
driver.pageLoadStrategy=normal
driver.options.acceptInsecureCerts=true

element.timeout=4000
element.pollingInterval=200

report.enabled=true
report.reporters=console,allure
report.outputPath=target/reports
report.screenshotOnFailure=true
report.options.allure.environment=local
